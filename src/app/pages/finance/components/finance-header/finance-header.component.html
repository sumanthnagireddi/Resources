<div
  class="flex flex-col gap-4 border-b border-[#ecefe9] pb-4 sm:gap-5 lg:flex-row lg:items-center lg:justify-between"
>
  <div class="flex items-center gap-3">
    <div
      aria-hidden="true"
      class="grid h-11 w-11 grid-cols-2 gap-[3px] rounded-2xl bg-[#f5faf5] p-2"
    >
      <span class="rounded-full bg-[#0f8b26]"></span>
      <span class="rounded-full bg-[#0f8b26]"></span>
      <span class="rounded-full bg-[#0f8b26]"></span>
      <span class="rounded-full bg-[#0f8b26]"></span>
    </div>

    <div>
      <p class="text-[11px] font-semibold uppercase tracking-[0.18em] text-[#8b9088]">
        Finance workspace
      </p>
      <p class="text-sm font-medium text-[#171917]">Monthly planning</p>
    </div>
  </div>

  <div class="flex flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-center sm:justify-end">
    <div
      class="grid grid-cols-2 gap-1 rounded-2xl border border-[#e8ece6] bg-[#f7f8f6] p-1"
    >
      <button
        *ngFor="let option of payloadOptions"
        type="button"
        [title]="option.label"
        class="inline-flex min-h-[42px] items-center justify-center gap-2 rounded-xl px-3 py-2 text-[13px] font-semibold transition-all duration-200"
        [ngClass]="(payloadType$ | async) === option.value
          ? 'bg-white text-[#1b1d1b] shadow-[0_6px_18px_rgba(15,23,42,0.06)]'
          : 'text-[#72766f] hover:text-[#1b1d1b]'"
        (click)="switchPayloadType(option.value)"
      >
        <span class="material-symbols-outlined text-[18px]">{{ option.icon }}</span>
        <span>{{ option.shortLabel }}</span>
      </button>
    </div>

    <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
      <button
        type="button"
        class="inline-flex min-h-[46px] items-center justify-center rounded-2xl border border-[#e6eae4] bg-white px-4 py-3 text-sm font-medium text-[#1a1c1a] transition hover:border-[#d7ded4] hover:bg-[#f8faf8]"
        (click)="openBudgetSettings()"
      >
        Budget
      </button>

      <button
        type="button"
        class="inline-flex min-h-[46px] items-center justify-center rounded-2xl bg-[#118533] px-4 py-3 text-sm font-medium text-white shadow-[0_14px_30px_rgba(17,133,51,0.18)] transition hover:bg-[#0f742d]"
        (click)="openAddForm()"
      >
        Add expense
      </button>
    </div>
  </div>
</div>

@if (showBudgetSettings$ | async) {
  <div
    class="fixed inset-0 z-[100] flex items-end justify-center bg-black/45 p-0 backdrop-blur-sm sm:items-center sm:p-4"
    (click)="closeBudgetSettings()"
  >
    <div
      class="w-full overflow-hidden rounded-t-3xl border border-gray-200 bg-white shadow-2xl sm:max-w-md sm:rounded-3xl"
      (click)="$event.stopPropagation()"
    >
      <div class="border-b border-gray-200 px-5 py-4">
        <div class="flex items-center justify-between gap-4">
          <div>
            <h2 class="flex items-center gap-2 text-lg font-semibold text-gray-900">
              <span class="material-symbols-outlined text-[#16853a]">tune</span>
              Budget settings
            </h2>
            <p class="mt-1 text-xs text-gray-500">For {{ monthLabel$ | async }}</p>
          </div>

          <button
            type="button"
            class="flex h-9 w-9 items-center justify-center rounded-xl text-gray-500 transition hover:bg-gray-100"
            (click)="closeBudgetSettings()"
          >
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
      </div>

      <div class="space-y-5 p-5">
        <button
          type="button"
          class="flex w-full items-center justify-center gap-2 rounded-2xl border border-dashed border-gray-300 px-4 py-3 text-sm font-medium text-gray-600 transition hover:border-[#16853a] hover:bg-[#f4faf5] hover:text-[#16853a]"
          (click)="copyBudgetFromPrevMonth()"
        >
          <span class="material-symbols-outlined text-lg">content_copy</span>
          Copy budget from previous month
        </button>

        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700">
            Monthly budget (₹)
          </label>
          <input
            type="number"
            [(ngModel)]="budgetForm.monthlyBudget"
            min="0"
            placeholder="e.g. 50000"
            class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-gray-900 outline-none transition focus:border-[#16853a] focus:ring-2 focus:ring-[#16853a]/15"
          />
          <p class="mt-1 text-xs text-gray-500">
            Set the spending ceiling for this month.
          </p>
        </div>

        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700">
            Alert threshold: {{ budgetForm.alertThreshold }}%
          </label>
          <input
            type="range"
            [(ngModel)]="budgetForm.alertThreshold"
            min="50"
            max="100"
            step="5"
            class="w-full accent-[#16853a]"
          />
          <div class="mt-1 flex justify-between text-xs text-gray-500">
            <span>50%</span>
            <span>100%</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-3 border-t border-gray-200 bg-gray-50 px-5 py-4">
        <button
          type="button"
          class="flex-1 rounded-2xl border border-gray-200 px-4 py-3 text-sm font-medium text-gray-700 transition hover:bg-gray-100"
          (click)="closeBudgetSettings()"
        >
          Cancel
        </button>
        <button
          type="button"
          class="flex-1 rounded-2xl bg-[#128433] px-4 py-3 text-sm font-medium text-white transition hover:bg-[#0f742d] disabled:cursor-not-allowed disabled:opacity-60"
          [disabled]="savingBudget$ | async"
          (click)="saveBudget()"
        >
          @if (savingBudget$ | async) {
            Saving...
          } @else {
            Save for {{ monthLabel$ | async }}
          }
        </button>
      </div>
    </div>
  </div>
}
