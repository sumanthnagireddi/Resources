<div
  class="flex w-full items-center justify-between gap-2 rounded-2xl border border-[#e7ebe6] bg-white p-1.5 sm:inline-flex sm:w-auto sm:justify-center"
>
  <button
    type="button"
    (click)="navigatePrev()"
    aria-label="Previous month"
    class="inline-flex h-9 w-9 items-center justify-center rounded-xl bg-[#f5f7f4] text-[#545853] transition hover:bg-[#edf2eb]"
  >
    <span class="material-symbols-outlined text-[18px]">chevron_left</span>
  </button>

  <span class="min-w-[132px] px-2 text-center text-sm font-medium text-[#181918]">
    {{ selectedMonth$ | async | date: 'MMMM y' }}
  </span>

  <button
    type="button"
    (click)="navigateNext()"
    aria-label="Next month"
    class="inline-flex h-9 w-9 items-center justify-center rounded-xl bg-[#f5f7f4] text-[#545853] transition hover:bg-[#edf2eb]"
  >
    <span class="material-symbols-outlined text-[18px]">chevron_right</span>
  </button>
</div>
