<section
  class="min-w-0 dark:border-slate-700 dark:bg-slate-900/90"
>

  <atlas-editor-angular
    class="block w-full"
    [appearance]="resolvedAppearance"
    [content]="resolvedContent"
    [contentWidth]="resolvedContentWidth"
    [description]="description"
    [heading]="heading"
    [minHeight]="minHeight"
    [mode]="mode"
    [placeholder]="placeholder"
    (editordocumentchange)="handleDocumentChange($event)"
  ></atlas-editor-angular>

  <p
    *ngIf="!widgetBundleReady && !widgetBundleError"
    class="text-sm text-gray-500 dark:text-slate-400"
  >
    Loading editor shell...
  </p>

  <p
    *ngIf="widgetBundleError"
    class="rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700 dark:border-red-900/40 dark:bg-red-950/30 dark:text-red-300"
  >
    {{ widgetBundleError }}
  </p>
</section>
