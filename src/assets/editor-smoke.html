<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlaskit Editor Smoke Harness</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
        --page-bg: #020617;
        --panel-bg: #0f172a;
        --panel-border: rgba(148, 163, 184, 0.24);
        --panel-text: #e2e8f0;
        --panel-muted: #94a3b8;
        --accent: #38bdf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top right, rgba(56, 189, 248, 0.16), transparent 32%),
          linear-gradient(180deg, #020617 0%, #0f172a 100%);
        color: var(--panel-text);
      }

      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      .panel {
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.88);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.28);
        backdrop-filter: blur(18px);
      }

      .hero {
        padding: 28px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--accent);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .copy {
        margin: 12px 0 0;
        max-width: 760px;
        color: var(--panel-muted);
        line-height: 1.7;
      }

      .stack {
        display: grid;
        gap: 20px;
        margin-top: 24px;
        max-width: 960px;
      }

      atlas-editor-angular {
        display: block;
      }

      .log {
        margin: 0;
        min-height: 180px;
        padding: 18px;
        overflow: auto;
        border: 1px solid var(--panel-border);
        border-radius: 18px;
        background: rgba(2, 6, 23, 0.72);
        color: #cbd5e1;
        font: 13px/1.6 "SFMono-Regular", Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel hero">
        <p class="eyebrow">Smoke Harness</p>
        <h1>Atlaskit Editor Feature Check</h1>
        <p class="copy">
          This page mounts the custom element directly so the automation can verify
          typing, slash insert, code blocks, tables, and emitted ADF without going
          through the rest of the Angular shell.
        </p>
      </section>

      <section class="stack">
        <atlas-editor-angular id="smoke-editor"></atlas-editor-angular>
        <atlas-editor-angular id="smoke-viewer"></atlas-editor-angular>
        <pre id="smoke-log" class="panel log">Waiting for editor changes...</pre>
      </section>
    </main>

    <script type="module" src="./my-react-app.bundle.js"></script>
    <script>
      const editor = document.getElementById('smoke-editor');
      const viewer = document.getElementById('smoke-viewer');
      const log = document.getElementById('smoke-log');

      document.documentElement.classList.add('dark');
      document.body.classList.add('dark');

      window.__editorSmoke = {
        lastChange: null,
        ready: false,
      };

      function updateLog(message) {
        log.textContent = message;
      }

      editor.appearance = 'full-page';
      editor.contentWidth = 'full-width';
      editor.heading = 'Smoke Test Editor';
      editor.description =
        'Exercise toolbar, slash insert, tables, code blocks, and emitted ADF.';
      editor.mode = 'edit';
      editor.placeholder = 'Type "/" to insert rich content blocks...';
      editor.minHeight = 640;

      viewer.heading = 'Smoke Test Viewer';
      viewer.description = 'Confirm view mode and narrow rendering stay compatible.';
      viewer.mode = 'view';
      viewer.contentWidth = 'narrow';
      viewer.content = {
        type: 'doc',
        version: 1,
        content: [
          {
            type: 'heading',
            attrs: { level: 2 },
            content: [{ type: 'text', text: 'Rendered in view mode' }],
          },
          {
            type: 'paragraph',
            content: [
              {
                type: 'text',
                text: 'This widget should render read-only content without an editable ProseMirror surface.',
              },
            ],
          },
        ],
      };

      editor.addEventListener('editordocumentchange', (event) => {
        window.__editorSmoke.lastChange = event.detail;
        updateLog(JSON.stringify(event.detail.adf, null, 2));
      });

      customElements.whenDefined('atlas-editor-angular').then(() => {
        window.__editorSmoke.ready = true;
      });
    </script>
  </body>
</html>
